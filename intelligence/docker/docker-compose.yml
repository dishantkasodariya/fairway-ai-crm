services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fairway
      POSTGRES_PASSWORD: fairway
      POSTGRES_DB: fairway
    ports:
      - "5439:5432"
    volumes:
      - fairway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairway -d fairway"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://fairway:fairway@postgres:5432/fairway
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  fairway_pgdata:
